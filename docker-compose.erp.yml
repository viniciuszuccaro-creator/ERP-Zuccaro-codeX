# Stack ERP separado do docker-compose oficial do Supabase.
# NÃO altera /root/supabase/docker nem o compose do Supabase.
#
# Rede: anexar a network EXTERNA descoberta com `docker network ls`
# (nao inventar nome — ver docs/ERP_DEV_DEPLOY_01.md).
#
# Portas: somente 127.0.0.1 (nao publicar 3080/3081 na internet).

services:
  erp-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: erp-api-dev
    restart: unless-stopped
    env_file:
      - .env.erp.dev
    environment:
      NODE_ENV: production
      ERP_ENV: dev
      PORT: "3080"
      REQUIRE_DATABASE: "true"
    ports:
      - "127.0.0.1:3080:3080"
    networks:
      - erp_net
    mem_limit: 512m
    cpus: 0.50
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  erp-web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_ERP_BACKEND: http
        # Same-origin via nginx proxy (/health /ready /api) — funciona sem DNS.
        VITE_ERP_API_SAME_ORIGIN: "true"
        VITE_ERP_API_BASE_URL: ""
    container_name: erp-web-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:3081:80"
    depends_on:
      erp-api:
        condition: service_healthy
    networks:
      - erp_net
    mem_limit: 128m
    cpus: 0.25

networks:
  erp_net:
    # Preencher ERP_DOCKER_NETWORK com o nome real da network do Supabase.
    name: ${ERP_DOCKER_NETWORK:?Set ERP_DOCKER_NETWORK to the real Supabase docker network name}
    external: true
