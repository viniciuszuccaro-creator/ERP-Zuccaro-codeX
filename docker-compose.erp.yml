# Stack ERP separado do docker-compose oficial do Supabase.
# Compartilha a rede Docker do Supabase de forma controlada (external network).
#
# Exemplo (apos criar a rede do Supabase self-hosted):
#   docker network ls | grep supabase
#   ERP_DOCKER_NETWORK=supabase_default DATABASE_URL=... docker compose -f docker-compose.erp.yml up -d --build
#
# NÃO altera o compose do Supabase no VPS.

services:
  erp-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: erp-api-dev
    restart: unless-stopped
    env_file:
      - .env.erp.dev
    environment:
      NODE_ENV: production
      ERP_ENV: dev
      PORT: 3080
      REQUIRE_DATABASE: "true"
    ports:
      # Bind apenas localhost no host; proxy reverso (Caddy/Nginx) expoe 443.
      - "127.0.0.1:3080:3080"
    networks:
      - erp_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  erp-web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_ERP_BACKEND: http
        VITE_ERP_API_BASE_URL: https://api-erp-dev.cpaferroeaco.com.br
    container_name: erp-web-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:3081:80"
    depends_on:
      - erp-api
    networks:
      - erp_net

networks:
  erp_net:
    name: ${ERP_DOCKER_NETWORK:-erp_runtime_net}
    external: ${ERP_DOCKER_NETWORK_EXTERNAL:-false}
