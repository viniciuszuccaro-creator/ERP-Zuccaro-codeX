name: erp-runtime-ci

on:
  push:
    branches: [main, 'cursor/**', 'codex/**']
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run audit:baseline
      - run: npm test
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: erp_test, POSTGRES_PASSWORD: erp_test, POSTGRES_DB: erp_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp_test -d erp_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run: { working-directory: server }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run migrate
        env: { DATABASE_URL: postgresql://erp_test:erp_test@localhost:5432/erp_test }
      - run: psql postgresql://erp_test:erp_test@localhost:5432/erp_test -f scripts/seed-dev-synthetic.sql
      - run: npm run test:postgres
        env: { DATABASE_URL: postgresql://erp_test:erp_test@localhost:5432/erp_test }