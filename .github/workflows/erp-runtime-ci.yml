name: erp-runtime-ci

on:
  push:
    branches: [main, 'cursor/**', 'codex/**']
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run audit:baseline
      - run: npm test
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: erp_test, POSTGRES_PASSWORD: erp_test, POSTGRES_DB: erp_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp_test -d erp_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run: { working-directory: server }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run migrate
        env: { DATABASE_URL: postgresql://erp_test:erp_test@localhost:5432/erp_test }
      - run: psql postgresql://erp_test:erp_test@localhost:5432/erp_test -f scripts/seed-dev-synthetic.sql
      - run: npm run test:postgres
        env: { DATABASE_URL: postgresql://erp_test:erp_test@localhost:5432/erp_test }
      - name: Prove isolated DB guard (blocks DEV / requires allowlist)
        working-directory: .
        run: bash scripts/vps/assert-isolated-database-url.sh --self-test
      - name: Prove R07B API (ca0bc5f3) on schema 001-024 (isolated DB)
        if: hashFiles('server/migrations/018_produto_pim_dam_outbox.sql') != ''
        working-directory: .
        env:
          DATABASE_URL: postgresql://erp_test:erp_test@localhost:5432/erp_r07b_compat
          ISOLATED_DATABASE_NAME: erp_r07b_compat
          ALLOW_DROP_SCHEMA_PUBLIC: ISOLATED_ONLY
          R07B_SHA: ca0bc5f3529b9071fe80e58dae6aa966a9d6c740
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$R07B_SHA" 2>/dev/null || git fetch --depth=1 origin ca0bc5f3 || true
          psql postgresql://erp_test:erp_test@localhost:5432/postgres -c "CREATE DATABASE erp_r07b_compat;"
          bash scripts/vps/prove-r07b-api-schema-compat.sh
          grep -q 'R07B_API_COMPAT_STATUS=OK' docs/vps/evidence/r07b-api-schema-016-024-compat.txt

  # Integração Expedição(#199) × Comercial(#178): fetch explícito da ref; skip/ausência = fail.
  expedicao-comercial-compose:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: server }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm install
      - name: Fetch Comercial migrations ref (obrigatório)
        working-directory: .
        env:
          COMERCIAL_BRANCH: codex/comercial-corrige-parecer-155
          # Tip #178 documentado no parecer Cursor (não tip-port).
          COMERCIAL_SHA: 4f8c6593506f681689e021226ab024f57c7aede9
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$COMERCIAL_BRANCH" "$COMERCIAL_SHA"
          git rev-parse --verify "$COMERCIAL_SHA"
          git merge-base --is-ancestor "$COMERCIAL_SHA" "origin/$COMERCIAL_BRANCH" \
            || git rev-parse "origin/$COMERCIAL_BRANCH"
          echo "COMERCIAL_MIGRATIONS_REF=$COMERCIAL_SHA" >> "$GITHUB_ENV"
      - name: Compose migrations 025-035 + 036 (fail se ref ausente ou suite skip)
        env:
          COMERCIAL_COMPOSE_REQUIRE: '1'
          # Prefer SHA pinado pelo step anterior; fallback explícito para não silenciar.
          COMERCIAL_MIGRATIONS_REF: ${{ env.COMERCIAL_MIGRATIONS_REF || '4f8c6593506f681689e021226ab024f57c7aede9' }}
        run: |
          set -euo pipefail
          test -n "${COMERCIAL_MIGRATIONS_REF}"
          git rev-parse --verify "$COMERCIAL_MIGRATIONS_REF"
          OUT="$(mktemp)"
          # node:test — qualquer # skip sob REQUIRE deve falhar (assert.fail no teste).
          npx tsx --test tests/runtime11-expedicao-compose-migrations.test.ts 2>&1 | tee "$OUT"
          if grep -Eiq '(^|# ) *skip(ped)?|t\.skip|TEST-SKIP' "$OUT"; then
            echo "::error::Suíte de composição Comercial+Expedição foi ignorada — não é aprovação"
            exit 1
          fi
          if ! grep -Eq 'pass [1-9]|# pass  [1-9]|tests [1-9]' "$OUT" && ! grep -Eq 'ok [0-9]+' "$OUT"; then
            # Aceita reporter tap/spec; falha se nenhum pass detectável
            if ! grep -Eq '✔|✓|pass' "$OUT"; then
              echo "::error::Nenhum pass detectado na composição"
              exit 1
            fi
          fi
