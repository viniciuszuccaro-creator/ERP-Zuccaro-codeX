name: erp-runtime-ci

on:
  push:
    branches: [main, 'cursor/**', 'codex/**']
  pull_request:

jobs:
  a1-native-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect native capability changes without rebuilding on documentation-only commits
        id: native
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null && git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- server/Dockerfile 'server/package*.json' 'server/src/services/a1*' 'server/tests/a1*' server/tests/helpers/a1RuntimeSmoke.mjs scripts/vps/package-a1-native.sh .github/workflows/erp-runtime-ci.yml; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
          else
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build canonical A1 runtime without private configuration
        if: steps.native.outputs.required == 'true'
        run: docker build --tag erp-a1-ci:${{ github.sha }} --file server/Dockerfile server
      - name: Prove native parser, chain, CRL, encryption and protected files
        if: steps.native.outputs.required == 'true'
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --memory 512m --cpus 1
          --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777
          --mount type=bind,src=${{ github.workspace }}/server/tests/helpers/a1RuntimeSmoke.mjs,dst=/run/a1-smoke.mjs,readonly
          erp-a1-ci:${{ github.sha }} node /run/a1-smoke.mjs
      - name: Export Linux-only native overlay
        if: steps.native.outputs.required == 'true'
        run: |
          image="$(docker image inspect --format '{{.Id}}' erp-a1-ci:${{ github.sha }})"
          bash scripts/vps/package-a1-native.sh "$image" "$RUNNER_TEMP/a1-native"
      - uses: actions/upload-artifact@v4
        if: steps.native.outputs.required == 'true'
        with:
          name: a1-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/a1-native/native-a1.tar.gz
            ${{ runner.temp }}/a1-native/native-a1.sha256
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Install backend dependencies used by root contract tests
        run: npm ci --prefix server
      - run: npm run audit:baseline
      - run: npm test -- --test-concurrency=4 'tests/**/*.test.js'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend:
    # pg_dump/pg_restore must match the PostgreSQL 16 service. ubuntu-latest
    # moved to 26.04; its client emitted transaction_timeout unsupported by 16.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: erp_test, POSTGRES_PASSWORD: erp_test, POSTGRES_DB: erp_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp_test -d erp_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run: { working-directory: server }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: server/package-lock.json }
      - name: Install root dependencies used by backend HTTP contract tests
        run: npm ci
        working-directory: .
      - run: npm install
      - run: npm run typecheck
      - name: Focus canonical Pedido read-summary contract before full backend suite
        run: node --import tsx --test tests/runtime09-pedido-service.test.ts
      - run: npm test
      - run: npm run build
      - run: npm run migrate
        env: { DATABASE_URL: postgresql://erp_test:erp_test@localhost:5432/erp_test }
      - name: Report PostgreSQL backup client and server versions
        run: |
          psql --version
          pg_dump --version
          pg_restore --version
          psql postgresql://erp_test:erp_test@localhost:5432/erp_test -Atc 'SHOW server_version_num'
      - run: psql postgresql://erp_test:erp_test@localhost:5432/erp_test -f scripts/seed-dev-synthetic.sql
      - run: npm run test:postgres
        env: { DATABASE_URL: postgresql://erp_test:erp_test@localhost:5432/erp_test }
      - name: Prove isolated DB guard (blocks DEV / requires allowlist)
        working-directory: .
        run: bash scripts/vps/assert-isolated-database-url.sh --self-test
      - name: Prove R07B API (ca0bc5f3) on schema 001-024 (isolated DB)
        if: hashFiles('server/migrations/018_produto_pim_dam_outbox.sql') != ''
        working-directory: .
        env:
          DATABASE_URL: postgresql://erp_test:erp_test@localhost:5432/erp_r07b_compat
          ISOLATED_DATABASE_NAME: erp_r07b_compat
          ALLOW_DROP_SCHEMA_PUBLIC: ISOLATED_ONLY
          R07B_SHA: ca0bc5f3529b9071fe80e58dae6aa966a9d6c740
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$R07B_SHA" 2>/dev/null || git fetch --depth=1 origin ca0bc5f3 || true
          psql postgresql://erp_test:erp_test@localhost:5432/postgres -c "CREATE DATABASE erp_r07b_compat;"
          bash scripts/vps/prove-r07b-api-schema-compat.sh
          grep -q 'R07B_API_COMPAT_STATUS=OK' docs/vps/evidence/r07b-api-schema-016-024-compat.txt

  expedicao-comercial-compose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: erp_test, POSTGRES_PASSWORD: erp_test, POSTGRES_DB: erp_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp_test -d erp_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run: { working-directory: server }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm install
      - name: Fetch Comercial migrations ref (obrigatório)
        working-directory: .
        env:
          COMERCIAL_BRANCH: codex/comercial-corrige-parecer-155
          # Tip #178 documentado no parecer Cursor (não tip-port).
          COMERCIAL_SHA: 4f8c6593506f681689e021226ab024f57c7aede9
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$COMERCIAL_BRANCH" "$COMERCIAL_SHA"
          git rev-parse --verify "$COMERCIAL_SHA"
          git merge-base --is-ancestor "$COMERCIAL_SHA" "origin/$COMERCIAL_BRANCH" \
            || git rev-parse "origin/$COMERCIAL_BRANCH"
          echo "COMERCIAL_MIGRATIONS_REF=$COMERCIAL_SHA" >> "$GITHUB_ENV"
          LATE_SHA=b3a683bba1bdd8dc3870ce4ba4eeb87430b3e561
          git fetch --no-tags origin "$LATE_SHA"
          git rev-parse --verify "$LATE_SHA"
          echo "COMERCIAL_LATE_MIGRATIONS_REF=$LATE_SHA" >> "$GITHUB_ENV"
      - name: Compose PGlite 025-044 (fail se ref ausente ou suite skip)
        env:
          COMERCIAL_COMPOSE_REQUIRE: '1'
          # Prefer SHA pinado pelo step anterior; fallback explícito para não silenciar.
          COMERCIAL_MIGRATIONS_REF: ${{ env.COMERCIAL_MIGRATIONS_REF || '4f8c6593506f681689e021226ab024f57c7aede9' }}
        run: |
          set -euo pipefail
          test -n "${COMERCIAL_MIGRATIONS_REF}"
          git rev-parse --verify "$COMERCIAL_MIGRATIONS_REF"
          OUT="$(mktemp)"
          # node:test TAP: exigir pass e rejeitar skip real (não confundir "# skipped 0").
          set +e
          npx tsx --test tests/runtime11-expedicao-compose-migrations.test.ts 2>&1 | tee "$OUT"
          TEST_EC=${PIPESTATUS[0]}
          set -e
          if [[ "$TEST_EC" -ne 0 ]]; then
            echo "::error::Teste de composição PGlite falhou (exit $TEST_EC)"
            exit "$TEST_EC"
          fi
          # Skip real: contador > 0 OU linha TAP "ok … # SKIP"
          if grep -Eq '^# skipped [1-9][0-9]*$' "$OUT" \
            || grep -Eqi '(^| )# SKIP( |$)' "$OUT" \
            || grep -Eqi 't\.skip\(|TEST-SKIP' "$OUT"; then
            echo "::error::Suíte de composição Comercial+Expedição foi ignorada — não é aprovação"
            exit 1
          fi
          if ! grep -Eq '^# pass [1-9][0-9]*$' "$OUT" && ! grep -Eq '^ok [1-9]' "$OUT"; then
            echo "::error::Nenhum pass detectado na composição PGlite"
            exit 1
          fi
          echo "COMPOSE_PGLITE_STATUS=OK ref=$COMERCIAL_MIGRATIONS_REF"
      - name: Compose PostgreSQL isolado 025-044 (trava 026 tip Comercial)
        env:
          COMERCIAL_COMPOSE_REQUIRE: '1'
          COMERCIAL_MIGRATIONS_REF: ${{ env.COMERCIAL_MIGRATIONS_REF || '4f8c6593506f681689e021226ab024f57c7aede9' }}
          DATABASE_URL: postgresql://erp_test:erp_test@localhost:5432/erp_test
        run: |
          set -euo pipefail
          test -n "${COMERCIAL_MIGRATIONS_REF}"
          git rev-parse --verify "$COMERCIAL_MIGRATIONS_REF"
          OUT="$(mktemp)"
          set +e
          npx tsx --test tests/runtime11-expedicao-compose-postgres.test.ts 2>&1 | tee "$OUT"
          TEST_EC=${PIPESTATUS[0]}
          set -e
          if [[ "$TEST_EC" -ne 0 ]]; then
            echo "::error::Teste de composição PostgreSQL isolado falhou (exit $TEST_EC)"
            exit "$TEST_EC"
          fi
          if grep -Eq '^# skipped [1-9][0-9]*$' "$OUT" \
            || grep -Eqi '(^| )# SKIP( |$)' "$OUT" \
            || grep -Eqi 't\.skip\(|TEST-SKIP' "$OUT"; then
            echo "::error::Suíte PostgreSQL de composição foi ignorada — não é aprovação"
            exit 1
          fi
          if ! grep -Eq '^# pass [1-9][0-9]*$' "$OUT" && ! grep -Eq '^ok [1-9]' "$OUT"; then
            echo "::error::Nenhum pass detectado na composição PostgreSQL"
            exit 1
          fi
          echo "COMPOSE_POSTGRES_STATUS=OK ref=$COMERCIAL_MIGRATIONS_REF"

  hml-runtime-package:
    # Packaging only. Deployment still requires the private HML gates.
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/casa-fechamento-hml-20261114'
    needs: [a1-native-runtime, frontend, backend, expedicao-comercial-compose]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: hml-runtime-package-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Check exact published source and detect package changes
        id: package
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$GITHUB_SHA" ]; then
            echo "::error::PACKAGE_SHA_MISMATCH actual=$actual_sha expected=$GITHUB_SHA"
            exit 1
          fi
          source_status="$(git status --porcelain)"
          if [ -n "$source_status" ]; then
            printf '%s\n' "$source_status"
            echo "::error::PACKAGE_CHECKOUT_NOT_CLEAN"
            exit 1
          fi
          if git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA" | grep -Eq '^(src/|server/(src/|package[^/]*json$|tsconfig)|scripts/vps/(hml-bootstrap|package-hml-runtime)\.mjs$|package[^/]*json$|vite\.config|\.github/workflows/erp-runtime-ci\.yml$)'; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.package.outputs.required == 'true'
        with: { node-version: '22', cache: npm }
      - name: Install locked public build dependencies
        if: steps.package.outputs.required == 'true'
        run: |
          npm ci
          npm ci --prefix server
      - name: Build and verify canonical API and web package
        if: steps.package.outputs.required == 'true'
        env:
          HML_PACKAGE_DIR: ${{ runner.temp }}/hml-runtime-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/vps/package-hml-runtime.mjs "$HML_PACKAGE_DIR"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileManifest } from './scripts/vps/package-hml-runtime.mjs';
          const root = process.env.HML_PACKAGE_DIR;
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json')));
          const version = JSON.parse(fs.readFileSync(path.join(root, 'web/.well-known/erp-version.json')));
          assert.equal(manifest.sha, process.env.GITHUB_SHA);
          assert.equal(manifest.sourceState, 'PUBLISHED_CLEAN');
          assert.equal(manifest.databaseOrSecretsIncluded, false);
          assert.equal(manifest.migrationsExecuted, false);
          assert.equal(version.sha, manifest.sha);
          assert.equal(version.apiSha, manifest.sha);
          assert.equal(version.webSha, manifest.sha);
          assert.equal(version.dataInBuild, false);
          assert.deepEqual(fileManifest(root).filter(file => file.path !== 'manifest.json'), manifest.files);
          console.log('HML_RUNTIME_PACKAGE_VERIFIED=' + manifest.sha);
          NODE
          tar -czf "$RUNNER_TEMP/hml-runtime-$GITHUB_SHA.tar.gz" -C "$HML_PACKAGE_DIR" .
          (cd "$RUNNER_TEMP" && sha256sum "hml-runtime-$GITHUB_SHA.tar.gz" > "hml-runtime-$GITHUB_SHA.sha256")
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.required == 'true'
        with:
          name: hml-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hml-runtime-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/hml-runtime-${{ github.sha }}.sha256
            ${{ runner.temp }}/hml-runtime-${{ github.sha }}/manifest.json
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
