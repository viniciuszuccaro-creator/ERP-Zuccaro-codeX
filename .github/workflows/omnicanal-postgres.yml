name: omnicanal-postgres
on:
  pull_request:
  push:
    branches: ['codex/comercial-omnicanal-*']
jobs:
  concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: erp_test, POSTGRES_PASSWORD: erp_test, POSTGRES_DB: erp_omnichannel_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp_test -d erp_omnichannel_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run: { working-directory: server }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: node --import tsx --test tests/omnichannel-concurrency.test.ts tests/omnichannel-outbox-postgres.test.ts tests/omnichannel-reconciliation-postgres.test.ts tests/omnichannel-rls-postgres.test.ts
        env: { OMNICHANNEL_POSTGRES_URL: 'postgresql://erp_test:erp_test@localhost:5432/erp_omnichannel_test' }
