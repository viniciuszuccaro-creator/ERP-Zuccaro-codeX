<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar ERP local</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; }
      main { width: min(560px, calc(100vw - 32px)); padding: 24px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; }
      h1 { margin: 0 0 12px; font-size: 22px; }
      p { line-height: 1.5; color: #475569; }
      input, button { display: block; margin-top: 16px; }
      button { padding: 10px 16px; cursor: pointer; }
      button:disabled { cursor: not-allowed; }
    </style>
  </head>
  <body>
    <main>
      <h1>Recuperar ERP local</h1>
      <p>Selecione um backup JSON privado neste computador. A restauracao substitui os dados locais deste navegador.</p>
      <input id="backup" type="file" accept=".json,application/json" aria-label="Backup JSON local" />
      <button id="restore" type="button" disabled>Restaurar</button>
      <p id="status" role="status"></p>
    </main>
    <script>
      (function () {
        var localHosts = ['localhost', '127.0.0.1', '::1', '[::1]'];
        var input = document.getElementById('backup');
        var button = document.getElementById('restore');
        var status = document.getElementById('status');
        if (!localHosts.includes(window.location.hostname)) {
          input.disabled = true;
          status.textContent = 'Restauracao disponivel somente em ambiente local.';
          return;
        }
        input.addEventListener('change', function () { button.disabled = !input.files.length; });
        button.addEventListener('click', async function () {
          var file = input.files[0];
          if (!file || !file.name.toLowerCase().endsWith('.json') || file.size > 30 * 1024 * 1024) {
            status.textContent = 'Selecione um arquivo JSON local valido de ate 30 MB.';
            return;
          }
          button.disabled = true;
          try {
            var snapshot = JSON.parse(await file.text());
            var entities = snapshot && snapshot.entities;
            var grupos = entities && entities.GrupoEmpresarial;
            var empresas = entities && entities.Empresa;
            if (!Array.isArray(grupos) || grupos.length !== 1 || !Array.isArray(empresas) || !empresas.length ||
                typeof grupos[0].id !== 'string' || !grupos[0].id.trim() ||
                empresas.some(function (empresa) { return !empresa || typeof empresa.id !== 'string' || !empresa.id.trim() ||
                  (empresa.group_id || empresa.grupo_id) !== grupos[0].id; }) ||
                new Set(empresas.map(function (empresa) { return empresa.id; })).size !== empresas.length ||
                (entities.User && !Array.isArray(entities.User))) {
              throw new Error('Estrutura de Grupo/Empresa invalida');
            }
            var grupoId = grupos[0].id;
            var empresaId = empresas[0].id;
            var empresaIds = empresas.map(function (empresa) { return empresa.id; }).filter(Boolean);
            var now = new Date().toISOString();
            var localUser = {
              id: 'local-admin-user', email: 'admin@erp-local.test', full_name: 'Administrador Local',
              role: 'admin', disabled: false, is_verified: true, contexto_atual: 'grupo',
              empresa_atual_id: empresaId, empresa_padrao_id: empresaId,
              grupo_atual_id: grupoId, grupo_padrao_id: grupoId,
              pode_operar_em_grupo: true, pode_ver_todas_empresas: true,
              empresas_vinculadas: empresaIds.map(function (id) { return { empresa_id: id, ativo: true, nivel_acesso: 'Administrador' }; }),
              grupos_vinculados: [{ grupo_id: grupoId, ativo: true, nivel_acesso: 'Administrador' }],
              created_date: now, updated_date: now
            };
            var restored = Object.assign({}, entities, {
              GrupoEmpresarial: grupos.map(function (grupo) {
                return Object.assign({}, grupo, { group_id: grupo.id, grupo_id: grupo.id, imported_from_base44: true, imported_at: now });
              }),
              Empresa: empresas.map(function (empresa) {
                return Object.assign({}, empresa, { group_id: grupoId, grupo_id: grupoId,
                  imported_from_base44: true, imported_at: now });
              }),
              User: [localUser].concat((entities.User || []).filter(function (user) { return user && user.id !== localUser.id; }))
            });
            localStorage.setItem('erp_integra_local_db_v1', JSON.stringify(restored));
            localStorage.setItem('erp_integra_local_user_v1', JSON.stringify(localUser));
            localStorage.setItem('contexto_atual', 'grupo');
            localStorage.setItem('empresa_atual_id', empresaId);
            localStorage.setItem('group_atual_id', grupoId);
            status.textContent = 'Backup local restaurado.';
            window.location.replace('/cadastros');
          } catch (error) {
            status.textContent = 'Nao foi possivel restaurar o backup local.';
            button.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
